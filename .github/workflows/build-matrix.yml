name: Matrice de build

on:
  pull_request:
    branches:
      - 'release/**'

jobs:
  build-matrix:
    name: Build ${{ matrix.os }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ['1.75.0', '1.80.0', '1.85.0', '1.88.0']

    steps:
      - name: Checkout du code
        uses: actions/checkout@v6

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-rust-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ matrix.rust }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Installer Rust ${{ matrix.rust }}
        run: |
          rustup toolchain install ${{ matrix.rust }}
          rustup default ${{ matrix.rust }}

      - name: Build release
        run: cargo build --release
