name: Publication release automatique

on:
  push:
    branches:
      - 'Feature/TP7-deployment'
  workflow_dispatch:  

jobs:
  publier-release:
    # if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      pull-requests: read 
    steps:
      - name: Checkout du commit de fusion
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Extraire le tag depuis la branche cible
        id: version
        run: |
          BASE="${{ github.event.pull_request.base.ref }}"
          TAG="${BASE#release/}"
          echo "tag=$TAG-test" >> $GITHUB_OUTPUT

      - name: Installer Rust stable
        run: rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Compiler le binaire et générer le manuel
        run: |
          wget -q https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xf typst-*
          sudo mv typst-*/typst /usr/local/bin/
          make build doc

      - name: Préparer les artefacts à publier
        run: |
          mkdir -p dist
          make debian || true
          cp simeis.deb dist/ || true
          cp target/release/simeis-server dist/simeis-server-linux-x86_64 || true
          cp doc/manual.pdf dist/manual.pdf || true
          cp doc/swagger.json dist/swagger.json || true
          cp sdk/python.py dist/simeis-sdk.py || true
          tar --exclude='target' -czf dist/simeis-sdk-rust.tar.gz -C sdk rust
          cp example/python/client.py dist/example-client.py
          cp README.md dist/README.md

      - name: Construire l'image Docker Simeis
        run: docker build -t litchipi/simeis:latest -f .github/Dockerfile .

      - name: Sauvegarder l'image Docker (Artefact pour la release GitHub)
        run: docker image save litchipi/simeis:latest | gzip > dist/simeis_image.tar.gz

      - name: Tester le lancement du conteneur
        run: |
          docker run -d --name simeis_test -p 8081:8081 --security-opt seccomp=unconfined litchipi/simeis:latest
          for i in $(seq 1 10); do
            if curl -s http://localhost:8081 > /dev/null 2>&1; then
              echo "Serveur prêt après ${i}s"
              break
            fi
            sleep 1
          done
          docker ps | grep simeis_test || (echo "Le conteneur a crashé" && docker logs simeis_test && exit 1)
          docker stop simeis_test
          docker rm simeis_test

      - name: Envoyer l'image sur Docker Hub
        run: |
          docker login -u litchipi --password-stdin <<< "${{ secrets.DOCKERHUB_TOKEN }}"
          docker push litchipi/simeis:latest

      - name: Créer la release GitHub et générer le Changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$TARGET" \
            --title "Release $TAG" \
            --generate-notes

      - name: Configurer l'accès SSH
        env:
          SSH_TOKEN: ${{ secrets.SSH_TOKEN }}
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_TOKEN" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p $VPS_PORT -H "$VPS_IP" >> ~/.ssh/known_hosts

      - name: Vérifier l'existence du fichier .deb
        run: |
          ls -la dist/

      - name: Copier le paquet .deb via SCP (Mode verbeux)
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_NOM: ${{ secrets.VPS_NOM }}
        run: |
          # On retire le -O et on ajoute || true pour ignorer le code -1
          scp -v -o StrictHostKeyChecking=no -P $VPS_PORT -i ~/.ssh/id_rsa dist/simeis.deb $VPS_NOM@$VPS_IP:/tmp/simeis.deb || true
          
      - name: Vérifier la présence du paquet sur le VPS
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_NOM: ${{ secrets.VPS_NOM }}
        run: |
          # Vérifie si le fichier existe et n'est pas vide sur le VPS
          ssh -o StrictHostKeyChecking=no -p $VPS_PORT -i ~/.ssh/id_rsa $VPS_NOM@$VPS_IP "ls -la /tmp/simeis.deb"

      - name: Installer le paquet sur le VPS via SSH (Mode verbeux)
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_NOM: ${{ secrets.VPS_NOM }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          ssh -v -o StrictHostKeyChecking=no -p $VPS_PORT -i ~/.ssh/id_rsa $VPS_NOM@$VPS_IP "echo '$VPS_PASSWORD' | sudo -S dpkg -i /tmp/simeis.deb"

      - name: Vérifier la connexion et la version déployée
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_NOM: ${{ secrets.VPS_NOM }}
          EXPECTED_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          sleep 5
          
          RESPONSE=$(ssh -o StrictHostKeyChecking=no -p $VPS_PORT -i ~/.ssh/id_rsa $VPS_NOM@$VPS_IP "curl -s --fail http://localhost:8081/version")
          echo "Réponse de l'API : $RESPONSE"
          ACTUAL_VERSION=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          for line in sys.stdin:
              line = line.strip()
              if line.startswith('{') and line.endswith('}'):
                  try:
                      print(json.loads(line).get('version', ''))
                      sys.exit(0)
                  except:
                      pass
          sys.exit(1)
          ")
          echo "Version attendue : $EXPECTED_VERSION"
          echo "Version en ligne : $ACTUAL_VERSION"
          
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Erreur : La version obtenue ($ACTUAL_VERSION) ne correspond pas à la version attendue ($EXPECTED_VERSION)"
            exit 1
          fi
          
          echo "Déploiement et version validés avec succès !"