name: Tests Fonctionnels Lourds

on:
  release:
    types: [prereleased, published]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  functional-tests:
    name: Lancer les tests fonctionnels 
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Checkout du code
        uses: actions/checkout@v6

      - name: Installation des dépendances Python
        run: |
          sudo apt-get update && sudo apt-get install -y python3-requests

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-heavy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-heavy-
            ${{ runner.os }}-cargo-

      - name: Compilation du serveur Simeis
        run: cargo build --release

      - name: Lancement du serveur en arrière-plan
        run: |
          cargo run --release &
          
          sleep 5

      - name: Exécution des tests fonctionnels
        run: |
          python3 tests/functional_tests.py 127.0.0.1 8081

      - name: Annuler le workflow en cas d'echec
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel ${{ github.run_id }}

  property-tests-heavy:
    name: Tests Property-Based Lourds
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Checkout du code
        uses: actions/checkout@v6

      - name: Exécution Property-Based Testing (Lourds - facteur 10)
        run: python3 tests/propertybased.py 10

      - name: Annuler le workflow en cas d'echec
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel ${{ github.run_id }}