name: Tests Fonctionnels Lourds

on:
  release:
    types: [prereleased, published]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  functional-tests:
    name: Lancer les tests fonctionnels 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installation des dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Lancement du serveur Simeis en arrière-plan
        run: |
          # Lance le serveur (Rust) en mode release pour pouvoir tester l'API localement
          # Le '&' permet de le lancer en arrière-plan pendant que la CI continue
          cargo run --release &
          
          # On attend 15 secondes pour s'assurer que le serveur a bien démarré
          sleep 15

      - name: Exécution des tests fonctionnels
        run: |
          python tests/functional_tests.py 127.0.0.1 8080