name: Tests Fonctionnels Lourds

on:
  release:
    types: [prereleased, published]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  functional-tests:
    name: Lancer les tests fonctionnels 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installation des dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Compilation du serveur Simeis
        run: cargo build --release

      - name: Lancement du serveur en arrière-plan
        run: |
          cargo run --release &
          
          sleep 5

      - name: Exécution des tests fonctionnels
        run: |
          python tests/functional_tests.py 127.0.0.1 8080